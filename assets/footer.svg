<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="Built on the edge, shipped from Android">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17123A"/>
      <stop offset="1" stop-color="#0B0A17"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#A78BFA" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="120" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="120" fill="url(#bg)"/>
    <rect x="160" y="34" width="880" height="1.5" fill="url(#line)"/>
    <circle cx="600" cy="34.75" r="5" fill="#F6821F"/>
    <text x="600" y="76" text-anchor="middle" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="24" font-style="italic" fill="#ECE9FF">Built on the edge, shipped from Android.</text>
    <text x="600" y="102" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="13" fill="#8B88A8">MuidSoft  |  Surabaya, Indonesia</text>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="119" rx="18" fill="none" stroke="#A78BFA" stroke-opacity="0.22"/>
</svg>
